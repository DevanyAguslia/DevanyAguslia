name: Generate Snake Animation

on:
  schedule:
    # Jalan otomatis tiap 12 jam
    - cron: "0 */12 * * *"
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # Jalan tiap kali push ke main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161B22,#312E81,#6D28D9,#A855F7,#22D3EE

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
